<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="apply_box">
            <h1>Job Application
            <span class="small">(Web)</span>
            </h1>
            <form action="#">
                <div class="form_container">
                    <div class="form_control">
                        <label for="first_name"> First Name</label>
                        <input id="first_name" 
                        name="first_name"
                        />
                    </div>

                    <div class="form_control">
                        <label for="last_name"> Last Name</label>
                        <input id="last_name" 
                        name="last_name"
                        />
                    </div>

                    <div class="form_control">
                        <label for="email"> Email </label>
                        <input id="email" 
                        type="email"
                        Email ="email"
                        />
                    </div>

                    <div class="form_control">
                        <label for="job_role"> Job Role </label>
                        <select id="job_role" name="job_role">
                            <option value=""> Search Job Role</option>
                            <option value="Front_end">Front_end</option>
                            <option value="Back_end">Back_end</option>
                            <option value="Full_Stack">Full_Stack</option>
                            <option value="UI_UX">UI_UX</option>
                        </select>
                    </div>

                    <div class="address_control">
                        <label for="address"> Address </label>
                        <textarea name="address" id="address" rows="4" cols="50"></textarea>
                    </div>

                    <div class="form_control">
                        <label for="city"> City </label>
                        <input id="city" name="city"
                        />
                    </div>

                    <div class="form_control">
                        <label for="pincode"> Pincode </label>
                        <input id="pincode" name="pincode" type="number"
                        />
                    </div>
                    <div class="form_control">
                        <label for="date"> DOB </label>
                        <input id="date" name="date" type="date"
                        />
                    </div>

                    <div class="form_control">
                        <label for="file"> Upload CV </label>
                        <input id="file" name="file" type="file"
                        />
                    </div>
                </div>
                <div class="button_container">
                        <button type="submit">Apply Now</button>
                    </div>
            </form>
        </div>
    </div>
</body>
</html>
